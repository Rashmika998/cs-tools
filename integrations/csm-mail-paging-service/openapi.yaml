openapi: 3.0.1
info:
  title: CSM Mail Paging Service API
  version: 1.0.0
  description: >
    A background worker with no inbound API surface beyond a health check.
    It polls a Gmail mailbox for mail sent to configured email groups and
    publishes a mail.alert.received event to the event bus for each match.
    See README.md for the rules and the event shape; there is nothing else
    here for an HTTP client to call.
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check endpoint, used by Choreo's liveness probe.
      operationId: getHealth
      responses:
        "200":
          description: Ok
